[build-system]
requires = ["setuptools>=46.4", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoscar"
version = "0.10.dev0"
description = "Pythonic API to WMO OSCAR Web Services"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["wmo", "oscar", "wigos", "station metadata", "gawsis"]
authors = [
    {name = "Tom Kralidis", email = "tomkralidis@gmail.com"},
]
maintainers = [
    {name = "Tom Kralidis", email = "tomkralidis@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
    "beautifulsoup4",
    "click",
    "lxml",
    "requests"
]

[project.optional-dependencies]
dev = ["flake8"]
release = ["build", "twine", "wheel"]

[project.scripts]
pyoscar = "pyoscar:cli"

[project.urls]
homepage = "https://github.com/wmo-cop/pyoscar"
source = "https://github.com/wmo-cop/pyoscar"
documentation = "https://github.com/wmo-cop/pyoscar"
issues = "https://github.com/wmo-cop/pyoscar/issues"
